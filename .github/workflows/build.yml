name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, stated explicitly: this workflow only ever reads the repository. Without the
# block, the job inherits whatever the repository default is — which for older repositories is
# read/write on every scope, handing a compromised build step a token that can push.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest

      - name: Release lint
        run: ./gradlew :app:lintRelease

      # Both variants run R8; r1test adds a debug signature and a separate application ID.
      - name: Release and R1 test builds
        run: ./gradlew :app:assembleRelease :app:assembleR1test

      - name: Upload R1 test APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nezha-agent-r1test-${{ github.sha }}
          path: app/build/outputs/apk/r1test/app-r1test.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/
            core/build/reports/tests/
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.xml
          retention-days: 7

  device:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 23
            target: default
          - api: 35
            target: google_apis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrument the optimized APK on API ${{ matrix.api }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run-device-regressions.sh
      - name: Archive exact device test APKs, mapping and evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-api-${{ matrix.api }}-${{ github.sha }}
          path: |
            app/build/outputs/apk/r1test/
            app/build/outputs/apk/androidTest/r1test/
            app/build/outputs/mapping/r1test/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            build/device-evidence/
          if-no-files-found: error
          retention-days: 14
