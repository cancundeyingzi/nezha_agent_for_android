name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest

      - name: Release lint
        run: ./gradlew :app:lintRelease

      # Both variants run R8; r1test adds a debug signature and a separate application ID.
      - name: Release and R1 test builds
        run: ./gradlew :app:assembleRelease :app:assembleR1test

      - name: Upload R1 test APK
        uses: actions/upload-artifact@v4
        with:
          name: nezha-agent-r1test
          path: app/build/outputs/apk/r1test/app-r1test.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            core/build/reports/tests/
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.xml
          retention-days: 7
