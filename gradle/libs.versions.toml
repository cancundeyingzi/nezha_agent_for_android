# Single source of truth for dependency and plugin versions.
#
# Update dependency versions here, regenerate app/core dependency locks, and review the resolved
# graph and OSV report together. See docs/SUPPLY_CHAIN.md for the commands and CI evidence.
# AGP/Kotlin/Compose upgrades require a separate compatibility review because they change generated
# code, shrinking and lint output; a library security fix must not silently upgrade the toolchain.

[versions]
agp = "8.6.0"
kotlin = "1.9.22"
protobufPlugin = "0.9.4"

# Must stay compatible with `kotlin` above — the Compose compiler extension is versioned against
# the Kotlin compiler, not against composeBom.
composeCompiler = "1.5.8"
composeBom = "2024.02.00"

androidxCore = "1.12.0"
androidxLifecycle = "2.7.0"
androidxActivity = "1.8.2"
# Pinned for read-only import of the legacy EncryptedSharedPreferences store; new writes use
# Keystore-backed DataStore. This is a migration compatibility choice, not a claim of latest status.
androidxSecurityCrypto = "1.1.0-alpha06"
androidxDataStore = "1.1.7"

gson = "2.10.1"
okhttp = "4.12.0"
grpc = "1.62.2"
grpcKotlin = "1.4.1"
protobuf = "3.25.9"
guava = "33.7.2-android"
# Host-only UTP fixes. Keep these out of APK configurations; see app's utpSecurityConstraints.
guavaJvm = "33.7.2-jre"
netty = "4.1.137.Final"
commonsIo = "2.14.0"
shizuku = "13.1.5"
tomcatAnnotations = "6.0.53"
junit = "4.13.2"
androidxTest = "1.6.1"
androidxTestRunner = "1.6.2"
androidxTestExtJunit = "1.2.1"
androidxTestEspresso = "3.6.1"
androidxTracing = "1.1.0"
desugarJdkLibs = "2.1.5"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "androidxActivity" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "androidxSecurityCrypto" }
androidx-datastore-core = { module = "androidx.datastore:datastore-core", version.ref = "androidxDataStore" }

# Versionless by design: compose-bom pins them, exactly as the literal declarations did.
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-test-core-ktx = { module = "androidx.test:core-ktx", version.ref = "androidxTest" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxTestEspresso" }
androidx-tracing = { module = "androidx.tracing:tracing", version.ref = "androidxTracing" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }

gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

grpc-okhttp = { module = "io.grpc:grpc-okhttp", version.ref = "grpc" }
grpc-protobuf-lite = { module = "io.grpc:grpc-protobuf-lite", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-kotlin-stub = { module = "io.grpc:grpc-kotlin-stub", version.ref = "grpcKotlin" }
protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
utp-guava = { module = "com.google.guava:guava", version.ref = "guavaJvm" }
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
commons-io = { module = "commons-io:commons-io", version.ref = "commonsIo" }

shizuku-api = { module = "dev.rikka.shizuku:api", version.ref = "shizuku" }
shizuku-provider = { module = "dev.rikka.shizuku:provider", version.ref = "shizuku" }

# compileOnly, only so generated gRPC/protobuf sources can see javax.annotation.Generated.
tomcat-annotations-api = { module = "org.apache.tomcat:annotations-api", version.ref = "tomcatAnnotations" }

junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
